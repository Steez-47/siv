# Builds, signs and publishes SIV when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# Uploads the NSIS installer and latest.json; installed copies of SIV update from
# https://github.com/Steez-47/siv/releases/latest/download/latest.json
# Needs repo secret TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/siv.key on the release machine).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Enable Defender and update signatures
        shell: pwsh
        run: |
          # Hosted Windows images disable these checks by default.
          Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -DisableArchiveScanning $false -ErrorAction Stop
          Update-MpSignature -ErrorAction Stop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node scripts/build.mjs
          args: -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: SIV ${{ github.ref_name }}
          releaseBody: Download the SIV installer below. Installed copies update themselves from Settings › Updates.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
